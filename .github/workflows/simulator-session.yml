# iOS Simulator セッションを張る caller workflow。実体は bannzai/simtunnel の session.yml（reusable workflow）。
# 参照: https://github.com/bannzai/simtunnel の PROJECT.md「各アプリ repo での実行」、手順は docs/simtunnel.md
name: simulator-session
# run-name は local/simtunnel CLI が run を特定するキーのためこの形式を維持する
run-name: "session=${{ inputs.session }} device=${{ inputs.device }}"

on:
  workflow_dispatch: # fork PR に Secrets を渡さないため workflow_dispatch のみ
    # session / device / duration_minutes は local/simtunnel の up が常に送るため宣言必須
    # （未定義の input を送ると dispatch が拒否される）
    inputs:
      session:
        description: "セッション名。tailnet ホスト名 simtunnel-<session> になる（小文字英数字とハイフンのみ）"
        required: true
        default: nikki
      device:
        description: "Simulator のデバイス名"
        required: true
        default: iPhone 17
      duration_minutes:
        description: "セッション維持時間（分）"
        required: true
        default: "60"

jobs:
  # Simulator 用 .app をビルドして artifact に上げる。
  # session.yml の build_project 入力（runner 上で xcodebuild 直叩き）を使わず caller 側でビルドするのは、
  # LicenseList の BuildToolPlugin の信頼確認を -skipPackagePluginValidation で省く必要があるため（Makefile と同じ理由）
  build:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read # checkout のみ。OIDC token (id-token) は session job だけに与える
    steps:
      # simtunnel 経路の workflow は uses を commit SHA で固定する（simtunnel PROJECT.md「リポジトリ公開に耐える安全性」）
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Simulator 用 Debug ビルド
        # runner には署名用の証明書が無いため署名を省く。Simulator は未署名の .app を実行できる
        run: |
          mkdir -p tmp
          xcodebuild -project Nikki.xcodeproj -scheme Nikki \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath tmp/DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build > tmp/app-build.log 2>&1 || {
              echo "ビルドに失敗。ログ末尾:" >&2
              tail -n 150 tmp/app-build.log >&2
              exit 1
            }
          grep -E 'warning:|\*\* BUILD' tmp/app-build.log || true
          test -d tmp/DerivedData/Build/Products/Debug-iphonesimulator/Nikki.app
          # .app だけを artifact に載せる（Products 直下の swiftmodule 等は不要）
          mkdir -p tmp/simulator-app
          ditto tmp/DerivedData/Build/Products/Debug-iphonesimulator/Nikki.app tmp/simulator-app/Nikki.app
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: simulator-app
          path: tmp/simulator-app # .app の親ディレクトリ（.app 直指定は中身が flatten される）

  session:
    needs: build
    # id-token: write が必要なのは reusable workflow を呼ぶこの job だけのため、job 単位で最小権限にする
    permissions:
      id-token: write # Tailscale の OIDC (workload identity federation) 認証に必要
      contents: read
    # タグ運用はしないため main の commit SHA で固定する（更新時は SHA を書き換える）
    uses: bannzai/simtunnel/.github/workflows/session.yml@a715305805c113d506612cfa1b15654963bf78c0 # main 2026-08-15
    with:
      session: ${{ inputs.session }}
      device: ${{ inputs.device }}
      duration_minutes: ${{ inputs.duration_minutes }}
      app_artifact: simulator-app
    secrets:
      TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
      TS_OIDC_AUDIENCE: ${{ secrets.TS_OIDC_AUDIENCE }}
