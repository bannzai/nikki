name: Nikki
options:
  bundleIdPrefix: com.bannzai
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: TQPN82UBBY
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Nikki:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Nikki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bannzai.Nikki
        PRODUCT_NAME: Nikki
        INFOPLIST_KEY_CFBundleDisplayName: Nikki
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      testTargets:
        - NikkiTests
    entitlements:
      path: Nikki/Nikki.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.bannzai.Nikki
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.com.bannzai.Nikki
        # CloudKit のサイレントプッシュ(サーバ変更通知)を受けるための APNs 環境。配布時は Xcode が production に差し替える
        aps-environment: development
    info:
      path: Nikki/Info.plist
      properties:
        CFBundleDisplayName: Nikki
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSFaceIDUsageDescription: 日記のロック解除に Face ID を使用します
        UIUserInterfaceStyle: Light
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - ZenKakuGothicNew-Regular.ttf
          - ZenKakuGothicNew-Medium.ttf
          - ZenKakuGothicNew-Bold.ttf
        # CloudKit のサーバ変更通知を受け取ってバックグラウンド同期するために必要
        UIBackgroundModes:
          - remote-notification

  NikkiTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: NikkiTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Nikki
